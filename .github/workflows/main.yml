name: Busca Diaria MPRJ

on:
  schedule:
    # Horário em UTC; Horário de Brasília = UTC-3
    - cron: '19 5 * * *' 
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: baixar codigo
        uses: actions/checkout@v5

      - name: configurar python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: instalar bibliotecas
        run: |
          pip install requests pandas openpyxl PyMuPDF

      - name: rodar busca
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          EMAIL_REMETENTE: ${{ secrets.EMAIL_REMETENTE }}
          EMAIL_SENHA_APP: ${{ secrets.EMAIL_SENHA_APP }}
        run: python busca_mprj.py
